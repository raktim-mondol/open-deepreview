name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript typecheck & test suite
        run: |
          bun run typecheck
          bun test

      - name: Package source tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          tar -czf "open-deepreview-${VERSION}.tar.gz" \
            package.json bun.lock tsconfig.json README.md LICENSE \
            src/ fixtures/ docs/ tests/

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "open-deepreview-${VERSION}.tar.gz" --clobber
          else
            gh release create "${VERSION}" "open-deepreview-${VERSION}.tar.gz" \
              --title "Open Deep Review ${VERSION}" \
              --generate-notes
          fi
