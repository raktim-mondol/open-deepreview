name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Typecheck, Unit Tests & CLI Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: bun run typecheck

      - name: Run unit & integration test suite
        run: bun test

      - name: Verify embedded Google Deep Review PAT fixture CLI
        run: bun run src/cli.ts fixture

      - name: Verify Firecrawl pdf-inspector PDF-to-Markdown CLI
        run: |
          bun run src/cli.ts pdf2md ./fixtures/newton_third_law_fixture.pdf -o /tmp/fixture_converted.md
          test -s /tmp/fixture_converted.md
          head -n 20 /tmp/fixture_converted.md

      - name: Verify cost estimator CLI
        run: bun run src/cli.ts estimate-cost ./fixtures/newton_third_law_fixture.pdf --model gemini-3.1-pro-preview --topology HIGH
